name: Android
on:
  push:
    paths: ['apps/android/**', 'scripts/build-android.sh', 'shared/api-contracts/**', 'shared/design-tokens/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/android/**', 'scripts/build-android.sh', 'shared/api-contracts/**', 'shared/design-tokens/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate dependencies, build, tests and lint
        run: scripts/build-android.sh dependencies assembleDebug testDebugUnitTest lintDebug assembleQa assembleQaAndroidTest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-reports-and-apk
          path: |
            apps/android/app/build/reports/
            apps/android/app/build/outputs/apk/
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          script: scripts/build-android.sh connectedQaAndroidTest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-instrumentation-reports
          path: apps/android/app/build/reports/androidTests/
